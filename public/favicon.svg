<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="apexGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#apexGrad)" filter="url(#glow)"/>
  
  <!-- Apex mountain peak "A" with upward arrow -->
  <path d="M16 6 L24 22 L20 22 L16 14 L12 22 L8 22 Z" fill="white" opacity="0.95"/>
  <path d="M16 10 L20 18 M16 10 L12 18" stroke="url(#apexGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  
  <!-- Small accent dot -->
  <circle cx="16" cy="10" r="1.5" fill="#10b981"/>
</svg>
