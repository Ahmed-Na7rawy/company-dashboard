<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Glass Hexagon Outer Container -->
  <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  
  <!-- Glowing Hexagonal Shield Motif -->
  <path d="M 250 80 L 390 160 L 390 320 L 250 400 L 110 320 L 110 160 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Modern Geometric Growth Bars -->
  <rect x="170" y="240" width="28" height="90" rx="8" fill="url(#primaryGrad)" />
  <rect x="216" y="195" width="28" height="135" rx="8" fill="url(#primaryGrad)" />
  <rect x="262" y="150" width="28" height="180" rx="8" fill="url(#accentGrad)" />
  <rect x="308" y="210" width="28" height="120" rx="8" fill="url(#primaryGrad)" />
  
  <!-- Trend Surge Arrow Peak -->
  <path d="M 150 250 L 230 170 L 280 210 L 360 130" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <polygon points="360,130 330,135 355,160" fill="#34d399" />
</svg>
